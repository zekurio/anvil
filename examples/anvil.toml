# anvil.toml holds the process settings only. Libraries, flows, and Arr
# connections are created and edited in the web UI.
[daemon]
temp_dir = "/var/lib/anvil/tmp"
store_path = "/var/lib/anvil/anvil.db"
control_socket = "/run/anvil/anvild.sock"

[web]
# The UI can replace and delete media files. Keep it on loopback, or set a
# password before listening on an address other machines can reach.
listen = "127.0.0.1:8484"
# password_file = "/run/secrets/anvil-web"

# Every supported setting and its default: examples/anvil-reference.toml
