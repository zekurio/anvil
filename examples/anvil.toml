[daemon]
temp_dir = "/var/lib/anvil/tmp"
store_path = "/var/lib/anvil/anvil.db"
worker_count = 2
total_threads = 8
max_attempts = 3
scan_interval = "30m"
filesystem_event_debounce = "2s"
scheduler_interval = "5s"
lease_duration = "30m"
shutdown_policy = "drain"
shutdown_timeout = "0s"
staging_cleanup_age = "0s"
log_level = "info"

[flows.av1-replace]
steps = ["probe", "crop-detect", "audio-cleanup", "stage", "crf-search", "encode", "dovi-fix", "validate", "replace", "cleanup"]

[flows.download-av1-handoff]
steps = ["probe", "crop-detect", "audio-cleanup", "stage", "crf-search", "encode", "dovi-fix", "validate", "handoff", "cleanup"]

[profiles.default-av1]
container = "mkv"

[profiles.default-av1.video]
codec = "av1"
accelerator = "software"
preset = "6"
pixel_format = "yuv420p10le"
crf_min = 18
crf_max = 40
target_vmaf = 95
min_savings_percent = 20
force_encode_on_no_fit = false
ffmpeg_args = []
ab_av1_args = []

[profiles.default-av1.video.dolby_vision]
mode = "auto"
codec = "hevc"
accelerator = "qsv"
preset = "medium"
pixel_format = "p010le"
ffmpeg_args = ["-global_quality", "24"]
ab_av1_args = ["--enc", "low_power=1"]
remove_hdr10plus = false

[profiles.default-av1.audio]
languages_to_keep = ["orig", "deu"]
fallback = "keep_first"
keep_commentary = false
unknown_as_original = true

[profiles.default-av1.subtitles]
mode = "preserve"
fallback = "keep_all"
keep_forced = true
keep_external = true

[profiles.default-av1.validation]
duration_tolerance_seconds = 2

[profiles.default-av1.metadata]
mode = "preserve"
track_titles = "strip"

[profiles.default-av1.attachments]
mode = "preserve"

[profiles.default-av1.chapters]
mode = "preserve"

[arrs.movies]
type = "radarr"
base_url = "http://radarr:7878"
api_key_file = "/run/secrets/radarr-api-key"

[arrs.tv]
type = "sonarr"
base_url = "http://sonarr:8989"
api_key_file = "/run/secrets/sonarr-api-key"

[libraries.movies]
kind = "media"
path = "/srv/media/movies"
arr = "movies"
flow = "av1-replace"
profile = "default-av1"
scan_interval = "1h"
priority = 0
include = ["*.mkv", "*.mp4"]
exclude = ["**/.staging/**"]

[libraries.movies.media]
replacement_mode = "replace"

[libraries.usenet-tv]
kind = "download"
path = "/downloads/complete/tv"
arr = "tv"
flow = "download-av1-handoff"
profile = "default-av1"
scan_interval = "5m"
priority = 10
include = ["*.mkv", "*.mp4"]
exclude = ["**/sample*/**", "**/*sample*"]

[libraries.usenet-tv.download]
handoff_path = "/imports/tv"
stable_for = "5m"
package_mode = "auto"
handoff_mode = "move"
preserve_relative_path = true
cleanup_source_media = true
prune_empty_dirs = true
