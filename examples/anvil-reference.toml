# Complete Anvil configuration reference. Copy only the settings your deployment needs.
# Names after profiles, arrs, and libraries are your own non-empty names.
#
# The smallest useful configuration is one library:
#
# [libraries.movies]
# path = "/srv/media/movies"
#
# A custom profile needs only changed values:
#
# [profiles.fast.video]
# preset = "4"
#
# The daemon and default profile sections show defaults. Machine-specific
# daemon paths and CPU counts use stable examples. Arr, library, and override
# sections are examples.

[daemon]
temp_dir = "/var/lib/anvil/tmp" # Scratch directory for search samples and process logs. Encode artifacts are written next to their publish destination as <name>.job-<id>.anvil-part. store_path and control_socket default to locations inside this directory.
store_path = "/var/lib/anvil/anvil.db" # SQLite state path. Defaults to anvil.db inside temp_dir; any non-empty path.
control_socket = "/run/anvil/anvild.sock" # Daemon Unix socket. Defaults to anvild.sock inside temp_dir; must be absolute.
worker_count = 2 # Simultaneous jobs. Defaults to the CPU count; integer >= 1.
total_threads = 8 # Shared encode-thread budget. Defaults to the CPU count; integer >= 0.
max_attempts = 3 # Retries before a job stays failed; integer >= 1.
scan_interval = "30m" # Full-library scan cadence; duration > 0.
filesystem_event_debounce = "2s" # Coalesce filesystem events before scanning; duration >= 0.
scheduler_interval = "5s" # Queue planning cadence; duration > 0.
lease_duration = "30m" # Time before an abandoned job lease is recoverable; duration > 0.
shutdown_policy = "drain" # Let active jobs finish or cancel them; "drain" or "cancel".
shutdown_timeout = "0s" # Force cancellation after this graceful wait; "0s" waits indefinitely; duration >= 0.
staging_cleanup_age = "0s" # Remove abandoned staging older than this; "0s" disables cleanup; duration >= 0.
log_level = "info" # Keep logs useful without excessive detail; "debug", "info", "warn", or "error".

[profiles.default-av1]
container = "mkv" # Output container; only "mkv".

[profiles.default-av1.video]
codec = "av1" # Output video codec; "av1", "hevc"/"h265", or "h264"/"avc".
accelerator = "software" # Encoder backend; "software", "qsv", "vaapi", or "amf".
preset = "6" # Trade speed for compression to match the selected encoder; any encoder-supported string.
bit_depth = 10 # Preserve more tonal detail when the encoder supports it; 8 or 10.
crf_min = 18 # Lowest search CRF; integer no greater than crf_max.
crf_max = 40 # Highest search CRF; integer no lower than crf_min.
samples = 0 # Fixed sample count for each CRF candidate; 0 uses ab-av1's duration-based count; integer >= 0.
metric = "vmaf" # Quality metric passed to ab-av1; "vmaf" or "xpsnr".
target = 95.0 # Minimum score for metric; number from 0 through 100. Required when metric is "xpsnr" (typical XPSNR target: 35-50).
min_savings_percent = 20.0 # Skip a result that saves too little space; number from 0 through 100.
force_encode_on_no_fit = false # Encode at the lowest observed CRF instead of preserving video when search finds no fit.
skip_encode = false # Copy video instead of searching and encoding when policy requires it.
ffmpeg_args = [] # Extra ffmpeg arguments appended to Anvil's command.
ab_av1_args = [] # Extra ab-av1 arguments appended to the search command.

[profiles.default-av1.crop]
seek_offsets = ["0s", "2m", "5m", "12m", "20m", "30m"] # Sample crop candidates at these input offsets; an empty list uses the default; non-negative Go duration strings.
frame_count = 300 # Frames analyzed at each seek offset; integer >= 1.
limit = 64 # ffmpeg cropdetect black threshold; integer from 1 through 255.
round = 16 # Round crop width and height to this multiple during detection; integer >= 1.
reset_count = 0 # Reset cropdetect's largest-area history after this many frames; 0 disables reset; integer >= 0.
min_retained_area_percent = 70.0 # Reject candidates retaining less source area and continue without cropping; finite number > 0 through 100.
min_width = 128 # Reject a crop narrower than this encoder safety floor; integer >= 1.
min_height = 128 # Reject a crop shorter than this encoder safety floor; integer >= 1.
required_alignment = 2 # Require crop dimensions and offsets to be divisible by this encoder alignment; integer >= 1.

# Unsafe crop candidates are recorded in job events and saved context, then
# discarded before CRF search and encode; cached candidates are revalidated
# before retries reuse them. Lower the retained-area threshold explicitly for
# unusually wide content that legitimately needs a deeper crop.

# Example override. These names match a canonical source codec family.
# Each field is optional here: omit it to inherit video settings; argument lists append.

[profiles.default-av1.video.overrides.hevc]
codec = "av1" # Override output codec for matching sources; omit to inherit.
accelerator = "software" # Override encoder backend for matching sources; omit to inherit.
preset = "6" # Override encoder preset for matching sources; omit to inherit.
bit_depth = 10 # Override output bit depth for matching sources; omit to inherit.
crf_min = 18 # Override lowest CRF for matching sources; omit to inherit.
crf_max = 40 # Override highest CRF for matching sources; omit to inherit.
metric = "vmaf" # Override search metric for matching sources; omit to inherit. Changing the metric requires setting target too.
target = 96.0 # Override the metric target for matching sources; omit to inherit.
min_savings_percent = 40.0 # Override the savings floor for matching sources; omit to inherit.
force_encode_on_no_fit = false # Override no-fit behavior for matching sources; omit to inherit.
skip_encode = false # Copy matching video instead of encoding only when explicitly needed; omit to inherit.
ffmpeg_args = [] # Append source-specific ffmpeg arguments.
ab_av1_args = [] # Append source-specific ab-av1 arguments.

[profiles.default-av1.audio]
languages_to_keep = [] # Retain original language plus chosen tags; language tags and "orig".
keep_commentary = false # Keep commentary audio tracks.
fallback = "keep_all" # Keep something when no requested audio matches; "keep_all", "keep_first", or "fail_job".
unknown_as_original = false # Treat unlabeled streams as original when metadata supplies one.

[profiles.default-av1.subtitles]
languages_to_keep = [] # Retain original language plus chosen tags; language tags and "orig".
keep_forced = false # Retain forced subtitles even when filtering.
keep_sdh = false # Retain SDH subtitles for accessibility.
keep_commentary = false # Keep commentary subtitle tracks.
fallback = "keep_all" # Keep something when no requested subtitle matches; "keep_all", "keep_first", or "fail_job".
unknown_as_original = false # Treat unlabeled subtitles as original when metadata supplies one.

[profiles.default-av1.validation]
duration_tolerance_seconds = 0.0 # Flag duration drift beyond this tolerance without failing the job; number >= 0.

[profiles.default-av1.metadata]
mode = "preserve" # Preserve or strip container metadata; "preserve" or "strip".
track_titles = "strip" # Preserve, clear, or standardize stream titles; "preserve", "strip", or "standardize".

[profiles.default-av1.attachments]
mode = "preserve" # Preserve or strip; "preserve" or "strip".

[profiles.default-av1.chapters]
mode = "preserve" # Preserve or strip; "preserve" or "strip".

[arrs.movies]
type = "radarr" # Metadata provider kind; "radarr" or "sonarr".
base_url = "http://radarr:7878" # Provider URL used for original-language lookup; non-empty URL.
api_key_file = "/run/secrets/radarr-api-key" # Secret-file credential, preferred over api_key. Set this or api_key.

[arrs.tv]
type = "sonarr" # Metadata provider kind; "radarr" or "sonarr".
base_url = "http://sonarr:8989" # Provider URL used for original-language lookup; non-empty URL.
api_key = "replace-with-a-secret" # Literal credential, redacted by check-config --show. Set this or api_key_file.

[libraries.movies]
kind = "media" # Replace media in place or process downloader output; "media" or "download".
path = "/srv/media/movies" # Root scanned for source files; non-empty path.
profile = "default-av1" # Named encoding policy; existing profile name.
scan_interval = "1h" # Override daemon scan cadence for this library; omit to use daemon.scan_interval; duration > 0 when set.
priority = 0 # Prefer higher-priority libraries when work competes; integer.
include = ["*.mkv", "*.mp4"] # Limit candidates to matching paths; empty matches all; doublestar glob patterns.
exclude = ["**/.staging/**"] # Skip paths before candidate discovery; doublestar glob patterns.
ignore_regex = ["(?i)/sample/"] # Record matching media as ignored; valid Go regular expressions.
concurrency_limit = 0 # Cap active jobs from this library; 0 means no per-library cap; integer >= 0.
arr = "movies" # Use this Arr instance for metadata; omit to disable lookup; existing arr name.

[libraries.movies.media]
replacement_mode = "replace" # Replace source files or publish a copy beside them; "replace" or "copy".

[libraries.downloads]
kind = "download" # Replace media in place or process downloader output; "media" or "download".
path = "/srv/downloads/complete/tv" # Root scanned for source files; non-empty path.
profile = "default-av1" # Named encoding policy; existing profile name.
scan_interval = "5m" # Override daemon scan cadence for this library; omit to use daemon.scan_interval; duration > 0 when set.
priority = 10 # Prefer higher-priority libraries when work competes; integer.
include = ["*.mkv", "*.mp4"] # Limit candidates to matching paths; empty matches all; doublestar glob patterns.
exclude = ["**/sample*/**", "**/*sample*"] # Skip paths before candidate discovery; doublestar glob patterns.
ignore_regex = [] # Record matching media as ignored; valid Go regular expressions.
concurrency_limit = 1 # Cap active jobs from this library; 0 means no per-library cap; integer >= 0.
arr = "tv" # Use this Arr instance for metadata; omit to disable lookup; existing arr name.

[libraries.downloads.download]
handoff_path = "/srv/imports/tv" # Destination watched by the importer; non-empty path for download libraries.
stable_for = "5m" # Fallback quiet period when no completion event is observed; close-write and moved-in transfers enqueue after debounce; duration >= 0.
package_mode = "auto" # Treat a download as a file or directory; "auto", "directory", or "file".
handoff_mode = "move" # Copy for safety or move when the downloader no longer needs it; "move" or "copy".
preserve_relative_path = true # Keep the package-relative directory structure below handoff_path.
cleanup_source_media = true # Delete source media only after a successful handoff.
prune_empty_dirs = true # Remove empty release directories only with source cleanup.
ignorable_globs = ["**/samples/**", "**/sample*/**", "**/*sample*", "**/*.txt", "**/*.url", "**/*.sfv", "**/*.srr", "**/*.nzb", "**/__MACOSX/**", "**/.DS_Store", "**/.nfs*"] # Excluded from download-package discovery and stability handling. During successful handoff source cleanup, matching paths may be deleted when cleanup_source_media and prune_empty_dirs are enabled. A non-empty list replaces the built-in default; doublestar glob patterns.
