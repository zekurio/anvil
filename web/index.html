<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- The daemon rewrites this to web.base_path, such as /anvil/. Every file
         and route of the build resolves against it (see src/lib/base.ts). -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- The daemon's Content-Security-Policy allows no inline style element.
         A csp-nonce tag without a nonce makes the UI kit build its component
         styles through the CSSOM (adoptedStyleSheets) instead of writing one. -->
    <meta property="csp-nonce" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111214" />
    <title>anvil</title>
    <script>
      // Apply the saved theme before first paint. Dark is the default.
      try {
        if (localStorage.getItem("anvil.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
